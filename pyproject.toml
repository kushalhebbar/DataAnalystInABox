[project]
name = "data-analyst-agent-framework"
version = "0.1.0"
description = "Autonomous data analysis agent that profiles data, asks clarifying questions, runs EDA, and writes an evidence-grounded summary."
authors = [
    {name = "Kushal Hebbar",email = "kushalhebbar@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "ollama (>=0.6.1,<0.7.0)",
    "numpy (>=2.4.1,<3.0.0)",
    "pandas (<3)",
    "pyarrow (>=23.0.0,<24.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "streamlit (>=1.53.1,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "langgraph (>=1.0.7,<2.0.0)",
    "langchain (>=1.2.7,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-ollama (>=1.0.1,<2.0.0)",
    "reportlab (>=4.4.9,<5.0.0)",
    "python-pptx (>=1.0.2,<2.0.0)",
    "matplotlib (>=3.9,<4.0)"
]

[project.optional-dependencies]
openai = ["langchain-openai (>=0.2,<1.0)"]
anthropic = ["langchain-anthropic (>=0.2,<1.0)"]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --ignore=code/tests/test_runner.py"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
